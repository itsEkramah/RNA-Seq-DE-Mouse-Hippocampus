name: Reproduce count analysis
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify public inputs and original archive
        run: python -m pytest -q tests/test_data.py
      - name: Reproduce all tables and figures
        run: python -m scripts.analyze --out results --threads 1
      - name: Check generated results
        run: python -m pytest -q tests/test_results.py tests/test_docs.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: count-analysis-results
          path: results/
          if-no-files-found: ignore
